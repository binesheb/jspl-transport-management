<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSPL Transport</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #17202a; }
    header { background: #111827; color: white; padding: 20px 28px; }
    main { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #ccd2d8; background: white; }
    button { cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .metric { font-size: 34px; font-weight: 700; }
    .muted { color: #68717b; }
    .ok { color: #16803c; }
    .warning { color: #a15c00; }
  </style>
</head>
<body>
<header><strong>JSPL Transport Management</strong><div class="muted" style="color:#cbd5e1">Palarivattom pilot</div></header>
<main>
  <div class="toolbar">
    <label>Trip <select id="trip"></select></label>
    <button onclick="refresh()">Refresh</button>
  </div>
  <section class="grid">
    <div class="card"><div class="muted">Expected</div><div class="metric" id="expected">-</div></div>
    <div class="card"><div class="muted">Boarded</div><div class="metric" id="boarded">-</div></div>
    <div class="card"><div class="muted">Remaining</div><div class="metric warning" id="remaining">-</div></div>
    <div class="card"><div class="muted">Exited from bus</div><div class="metric" id="exited">-</div></div>
  </section>
  <p id="message" class="muted"></p>
</main>
<script>
const API = 'http://localhost:8000';
async function loadTrips() {
  const res = await fetch(`${API}/api/showrooms`);
  if (!res.ok) throw new Error('API unavailable');
  // Trip listing endpoint is added in the next application phase.
  document.getElementById('message').textContent = 'Backend foundation is running. Trip live-listing is the next module.';
}
async function refresh() {
  await loadTrips().catch(err => document.getElementById('message').textContent = err.message);
}
refresh();
</script>
</body>
</html>
