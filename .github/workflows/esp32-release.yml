name: ESP32 Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI
        run: |
          arduino-cli config init \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Espressif Arduino-ESP32 core 3.3.11
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install exact display libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library@1.12.1"
          arduino-cli lib install "Adafruit SSD1306@2.5.15"
          arduino-cli lib install "Adafruit BusIO@1.17.2"

      - name: Set release firmware version
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("firmware/esp32-minimal/src/version.h")
          text = path.read_text()
          text, count = re.subn(
              r'#define JSPL_FW_VERSION\s+"[^"]+"',
              f'#define JSPL_FW_VERSION "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("JSPL_FW_VERSION definition not found")
          path.write_text(text)
          PY
          echo "$VERSION" > firmware/esp32-minimal/ota-version.txt

      - name: Build Arduino IDE firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --export-binaries \
            firmware/arduino/JSPL_PVM_Gate

      - name: Locate and normalize firmware binary
        run: |
          BIN=$(find firmware/arduino/JSPL_PVM_Gate/build -type f -name '*.ino.bin' -print -quit)
          if [ -z "$BIN" ]; then
            echo "No Arduino firmware binary was produced."
            find firmware/arduino/JSPL_PVM_Gate/build -type f -maxdepth 5 -print || true
            exit 1
          fi
          cp "$BIN" firmware.bin
          test -s firmware.bin

      - name: Generate firmware checksum
        run: sha256sum firmware.bin | awk '{print $1}' > firmware.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" \
              firmware.bin \
              firmware/esp32-minimal/ota-version.txt \
              firmware.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              firmware.bin \
              firmware/esp32-minimal/ota-version.txt \
              firmware.sha256 \
              --title "$TAG" \
              --generate-notes
          fi
