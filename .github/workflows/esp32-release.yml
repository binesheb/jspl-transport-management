name: ESP32 Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-minimal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building JSPL Transport firmware $VERSION"

      - name: Set firmware version
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("firmware/esp32-minimal/src/version.h")
          text = path.read_text()
          text, count = re.subn(
              r'#define JSPL_FW_VERSION\s+"[^"]+"',
              f'#define JSPL_FW_VERSION "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("JSPL_FW_VERSION definition not found")
          path.write_text(text)
          PY
          echo "$VERSION" > firmware/esp32-minimal/ota-version.txt

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Verify firmware exists
        run: test -s .pio/build/esp32dev/firmware.bin

      - name: Generate firmware checksum
        run: sha256sum .pio/build/esp32dev/firmware.bin | awk '{print $1}' > firmware.sha256

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" \
              firmware/esp32-minimal/.pio/build/esp32dev/firmware.bin \
              firmware/esp32-minimal/ota-version.txt \
              firmware/esp32-minimal/firmware.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              firmware/esp32-minimal/.pio/build/esp32dev/firmware.bin \
              firmware/esp32-minimal/ota-version.txt \
              firmware/esp32-minimal/firmware.sha256 \
              --title "$TAG" \
              --generate-notes
          fi
