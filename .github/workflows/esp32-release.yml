name: ESP32 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-minimal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          path = Path("src/version.h")
          text = path.read_text()
          text = text.replace('#define JSPL_FW_VERSION "1.0.0"', f'#define JSPL_FW_VERSION "{version}"')
          path.write_text(text)
          PY
          echo "$VERSION" > ota-version.txt
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "firmware/esp32-minimal/.pio/build/esp32dev/firmware.bin" \
            "firmware/esp32-minimal/ota-version.txt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
