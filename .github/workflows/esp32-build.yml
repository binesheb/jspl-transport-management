name: ESP32 Build Check

on:
  push:
    branches:
      - main
      - feature/esp32-minimal
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-minimal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ESP32 firmware
        run: pio run
      - name: Verify firmware binary
        run: test -s .pio/build/esp32dev/firmware.bin
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jspl-esp32-firmware-${{ github.sha }}
          path: firmware/esp32-minimal/.pio/build/esp32dev/firmware.bin
          if-no-files-found: error
          retention-days: 14
