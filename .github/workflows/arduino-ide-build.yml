name: Arduino IDE Build Check

on:
  push:
    branches:
      - feature/esp32-minimal
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI
        run: arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

      - name: Compile Arduino IDE sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/arduino/JSPL_PVM_Gate
