name: Mobile iOS Build

on:
  push:
    branches: [main, 'phase/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter platform scaffolding
        run: flutter create --platforms=ios .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          mkdir -p build/ios-artifact
          cp -R build/ios/iphoneos/Runner.app build/ios-artifact/Runner.app

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: jayalakshmi-drive-ios-${{ github.sha }}
          path: mobile/build/ios-artifact/Runner.app
          if-no-files-found: error
