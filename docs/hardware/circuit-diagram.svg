<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#163a63">PALARIVATTOM V1 COUNTER — CIRCUIT DIAGRAM</text>
<text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="15" fill="#555">ESP32 DevKit V1 • 128×64 SSD1306 SPI OLED • 3 hostel buttons • buzzer</text>

<!-- ESP32 -->
<rect x="440" y="170" width="320" height="410" rx="22" fill="#20252b" stroke="#111" stroke-width="3"/>
<text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">ESP32 DEVKIT V1</text>
<text x="600" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#bbb">3.3V logic • INPUT_PULLUP buttons</text>

<!-- buttons -->
<text x="55" y="135" font-family="Arial" font-size="20" font-weight="700" fill="#163a63">HOSTEL BUTTONS</text>
<g font-family="Arial">
<rect x="55" y="175" width="220" height="75" rx="14" fill="#f7f7f7" stroke="#d33" stroke-width="3"/><circle cx="105" cy="212" r="22" fill="#222"/><text x="145" y="207" font-size="22" font-weight="700" fill="#d33">KAL</text><text x="145" y="230" font-size="15">GPIO 25</text>
<rect x="55" y="285" width="220" height="75" rx="14" fill="#f7f7f7" stroke="#2857b7" stroke-width="3"/><circle cx="105" cy="322" r="22" fill="#222"/><text x="145" y="317" font-size="22" font-weight="700" fill="#2857b7">VYT</text><text x="145" y="340" font-size="15">GPIO 26</text>
<rect x="55" y="395" width="220" height="75" rx="14" fill="#f7f7f7" stroke="#249447" stroke-width="3"/><circle cx="105" cy="432" r="22" fill="#222"/><text x="145" y="427" font-size="22" font-weight="700" fill="#249447">VAZ</text><text x="145" y="450" font-size="15">GPIO 27</text>
<line x1="75" y1="250" x2="75" y2="540" stroke="#222" stroke-width="3"/><line x1="75" y1="540" x2="275" y2="540" stroke="#222" stroke-width="3"/><text x="55" y="570" font-size="16" font-weight="700">All button returns → GND</text>
</g>

<!-- button wires -->
<line x1="275" y1="212" x2="440" y2="260" stroke="#d33" stroke-width="4"/>
<line x1="275" y1="322" x2="440" y2="330" stroke="#2857b7" stroke-width="4"/>
<line x1="275" y1="432" x2="440" y2="400" stroke="#249447" stroke-width="4"/>

<!-- OLED -->
<rect x="865" y="145" width="290" height="235" rx="18" fill="#f2f5f8" stroke="#163a63" stroke-width="3"/>
<text x="1010" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163a63">128×64 OLED</text>
<text x="1010" y="205" text-anchor="middle" font-family="Arial" font-size="15">SSD1306 • SPI</text>
<rect x="900" y="225" width="220" height="105" rx="8" fill="#050505"/>
<text x="1010" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="white">KAL 90  VYT 12</text>
<text x="1010" y="292" text-anchor="middle" font-family="Arial" font-size="20" fill="white">VAZ 8</text>
<text x="1010" y="318" text-anchor="middle" font-family="Arial" font-size="12" fill="#ccc">READY TO BOARD</text>

<!-- OLED wires -->
<g font-family="Arial" font-size="14" font-weight="700">
<line x1="760" y1="270" x2="865" y2="270" stroke="#f28c28" stroke-width="3"/><text x="770" y="262" fill="#f28c28">GPIO16 → DC</text>
<line x1="760" y1="300" x2="865" y2="300" stroke="#e5b72c" stroke-width="3"/><text x="770" y="292" fill="#b28c00">GPIO17 → RST</text>
<line x1="760" y1="330" x2="865" y2="330" stroke="#2d9b52" stroke-width="3"/><text x="770" y="322" fill="#2d9b52">GPIO5 → CS</text>
<line x1="760" y1="360" x2="865" y2="360" stroke="#2457b7" stroke-width="3"/><text x="770" y="352" fill="#2457b7">GPIO18 → SCK</text>
<line x1="760" y1="390" x2="865" y2="390" stroke="#7b39b7" stroke-width="3"/><text x="770" y="382" fill="#7b39b7">GPIO23 → MOSI</text>
</g>

<!-- power -->
<rect x="420" y="625" width="360" height="95" rx="15" fill="#fff7e6" stroke="#d28b00" stroke-width="2"/>
<text x="600" y="655" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#8a5a00">POWER</text>
<text x="600" y="682" text-anchor="middle" font-family="Arial" font-size="14">USB 5V → ESP32 • OLED powered from 3V3</text>
<text x="600" y="704" text-anchor="middle" font-family="Arial" font-size="14">All grounds must be common</text>

<!-- buzzer -->
<rect x="865" y="455" width="250" height="110" rx="18" fill="#f7f7f7" stroke="#163a63" stroke-width="3"/>
<text x="990" y="485" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">ACTIVE BUZZER</text>
<text x="990" y="512" text-anchor="middle" font-family="Arial" font-size="14">GPIO 32 → + / signal</text>
<text x="990" y="538" text-anchor="middle" font-family="Arial" font-size="14">GND → −</text>
<line x1="760" y1="500" x2="865" y2="500" stroke="#7b39b7" stroke-width="4"/>

<!-- notes -->
<rect x="55" y="620" width="310" height="100" rx="15" fill="#eef6ff" stroke="#5b89b8" stroke-width="2"/>
<text x="75" y="648" font-family="Arial" font-size="17" font-weight="700" fill="#163a63">BUTTON LOGIC</text>
<text x="75" y="674" font-family="Arial" font-size="14">Short press = +1</text>
<text x="75" y="696" font-family="Arial" font-size="14">10-second hold = release mode</text>

<text x="600" y="765" text-anchor="middle" font-family="Arial" font-size="13" fill="#666">Verify the exact OLED module pin labels before wiring. This diagram assumes an SPI SSD1306 module.</text>
</svg>